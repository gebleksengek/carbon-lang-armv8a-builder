name: Nightly Release ARMv8-a

on:
  schedule:
    - cron: 0 5 * * *
  workflow_dispatch:
    inputs:
      nightly_release_tag:
        type: string
        description: Carbon language release tag source

env:
  CARBON_LANG_WORKDIR: carbon-lang
  BUILDER_WORKDIR: builder

permissions:
  contents: write
      
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout to Latest Tag and Set nightly_date
        id: get_tag
        env:
          latest_tag: ${{ inputs.nightly_release_tag }}
        run: |
          LATEST_TAG=${{ inputs.nightly_release_tag }}
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git ls-remote --tags --sort="-v:refname" https://github.com/carbon-language/carbon-lang.git "*nightly*" | head -n 1 | cut -d'/' -f3)
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "nightly_date=$(echo $LATEST_TAG | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}')" >> $GITHUB_ENV
          
      - uses: actions/checkout@v6
        name: Clone carbon language repository
        with:
          repository: "carbon-language/carbon-lang"
          path: ${{ env.CARBON_LANG_WORKDIR }}
          ref: ${{ steps.get_tag.outputs.tag }}
          clean: false

      - uses: actions/checkout@v6
        with:
          path: ${{ env.BUILDER_WORKDIR }}
          clean: false
          
      - name: Apply patches
        working-directory: ${{ env.CARBON_LANG_WORKDIR }}
        run: |
          git apply -v ../${{ env.BUILDER_WORKDIR }}/patches/*patch

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: '0.11.15'

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          external-cache: true
          module-root: ${{ env.CARBON_LANG_WORKDIR }}
          bazelrc: |
            common --custom_malloc=@bazel_tools//tools/cpp:malloc
            build --nostamp
            build --verbose_failures
            test --test_output=errors
            
      - uses: actions/cache@v5
        id: llvm-cache
        with:
          path: ~/llvm
          key: ${{ runner.os }}-${{ runner.arch }}-llvm_20_cache

      - name: Download LLVM and Clang Installation
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd ~
          LLVM_RELEASE=20.1.8
          LLVM_TARBALL_NAME=LLVM-$LLVM_RELEASE-Linux-ARM64
          LLVM_PATH=~/llvm
          echo "*** Downloading $LLVM_RELEASE"
          wget --show-progress=off "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_RELEASE/$LLVM_TARBALL_NAME.tar.xz"
          echo "*** Extracting $LLVM_TARBALL_NAME.tar.xz"
          mkdir $LLVM_PATH
          tar -xJf $LLVM_TARBALL_NAME.tar.xz --strip-components=1 -C $LLVM_PATH
          echo "*** Deleting $LLVM_TARBALL_NAME.tar.xz"
          rm $LLVM_TARBALL_NAME.tar.xz
          echo "*** Testing `clang++ --version`"
          $LLVM_PATH/bin/clang++ --version
          # The installation contains *huge* parts of LLVM we don't need for the
          # toolchain. Prune them here to keep our cache small.
          echo "*** Cleaning the 'llvm' directory"
          rm -f $LLVM_PATH/lib/{*.a,*.so,*.so.*}
          rm -f $LLVM_PATH/bin/{flang-*,mlir-*,clang-{scan-deps,check,repl},*-test,llvm-{lto*,reduce,bolt*,exegesis,jitlink},bugpoint,opt,llc}
          rm -rf $LLVM_PATH/share/{doc,man}
          echo "*** Size of the 'llvm' directory"
          du -hs $LLVM_PATH

      - name: Setup LLVM and Clang paths
        shell: bash
        run: |
          LLVM_PATH=~/llvm
          echo "Using ${LLVM_PATH}"
          echo "${LLVM_PATH}/bin" >> $GITHUB_PATH
          echo '*** ls "${LLVM_PATH}"'
          ls "${LLVM_PATH}"
          echo '*** ls "${LLVM_PATH}/bin"'
          ls "${LLVM_PATH}/bin"
          echo "CC=$HOME/llvm/bin/clang" >> $GITHUB_ENV
          echo "CXX=$HOME/llvm/bin/clang++" >> $GITHUB_ENV

      - name: Print tool debugging info
        shell: bash
        working-directory: ${{ env.CARBON_LANG_WORKDIR }}
        run: |
          echo '*** PATH'
          echo $PATH
          echo '*** bazelisk'
          which bazelisk
          bazelisk --version
          echo '*** run_bazel.py'
          ./scripts/run_bazel.py --version
          echo '*** uv'
          which uv
          uv --version
          uv python list --only-installed
          echo '*** clang'
          which clang
          clang --version
          echo '*** clang++'
          which clang++
          clang++ --version
          echo '*** clang-tidy'
          which clang-tidy
          clang-tidy --version

      - name: Run bazel to sync deps with retry
        shell: bash
        working-directory: ${{ env.CARBON_LANG_WORKDIR }}
        run: |
          # GitHub sometimes has a high failure rate for Bazel's downloads (even
          # from GitHub URLs). Bazel exits with `1` on HTTP errors, which is hard
          # to distinguish from a normal, permanent error.
          #
          # This workaround runs fast commands that should always pass (although
          # they may be broken by an invalid PR). All errors are retried. The hope
          # is that this caches necessary downloads, allowing later commands to
          # more reliably succeed without retrying "permanent" errors.
          #
          # Disable lockfile updates, because some actions want to see
          # differences.
          ./scripts/run_bazel.py --attempts=5 --retry-all-errors \
            mod --lockfile_mode=off deps
          ./scripts/run_bazel.py --attempts=5 --retry-all-errors \
            cquery --lockfile_mode=off //... | wc -l
          
      - name: Build release
        working-directory: ${{ env.CARBON_LANG_WORKDIR }}
        run: |
          ./scripts/run_bazel.py test -c opt \
            --pre_release=nightly --nightly_date=${{ env.nightly_date }} \
            //toolchain \
            //toolchain/install:carbon_toolchain_tar_gz \
            //toolchain/install:carbon_toolchain_tar_gz_test

      - name: Extract the release version
        working-directory: ${{ env.CARBON_LANG_WORKDIR }}
        run: |
          ./bazel-bin/toolchain/carbon version
          VERSION=$( \
            ./bazel-bin/toolchain/carbon version \
            | cut -d' ' -f5 | cut -d'+' -f1)
          echo "release_version=$VERSION" >> $GITHUB_ENV

      - name: Release
        working-directory: ${{ env.BUILDER_WORKDIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ env.release_version }} \
            --title "Nightly build ${{ env.nightly_date }}" \
            --notes "ref: https://github.com/carbon-language/carbon-lang/releases/tag/v${{ env.release_version }}" \
            --prerelease \
            --target main \
            ../${{ env.CARBON_LANG_WORKDIR }}/bazel-bin/toolchain/install/carbon_toolchain-${{ env.release_version }}.tar.gz
